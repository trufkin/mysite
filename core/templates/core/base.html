{% load static i18n %}
<!doctype html>
<html lang="{{ request.LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Bolohan{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

  <nav class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'home' %}">Bolohan</a>
      <ul class="nav-links">
        <li><a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} class="active"{% endif %}>{% trans "Home" %}</a></li>
        <li><a href="{% url 'contacts' %}"{% if request.resolver_match.url_name == 'contacts' %} class="active"{% endif %}>{% trans "Contacts" %}</a></li>
      </ul>
      <div class="lang-switcher">
        <form action="{% url 'set_language' %}" method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.path }}">
          <button type="submit" name="language" value="en"{% if request.LANGUAGE_CODE == 'en' %} class="active"{% endif %}>EN</button>
          <button type="submit" name="language" value="ro"{% if request.LANGUAGE_CODE == 'ro' %} class="active"{% endif %}>RO</button>
          <button type="submit" name="language" value="ru"{% if request.LANGUAGE_CODE == 'ru' %} class="active"{% endif %}>RU</button>
        </form>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
