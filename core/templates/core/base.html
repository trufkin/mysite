{% load static i18n %}
<!doctype html>
<html lang="{{ request.LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Bolohan{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

  <nav class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'home' %}">Bolohan</a>
      <ul class="nav-links">
        <li><a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} class="active"{% endif %}>{% trans "Home" %}</a></li>
        <li><a href="{% url 'contacts' %}"{% if request.resolver_match.url_name == 'contacts' %} class="active"{% endif %}>{% trans "Contacts" %}</a></li>
      </ul>
      <div class="lang-switcher">
        <button onclick="switchLang('en')"{% if request.LANGUAGE_CODE == 'en' %} class="active"{% endif %}>EN</button>
        <button onclick="switchLang('ro')"{% if request.LANGUAGE_CODE == 'ro' %} class="active"{% endif %}>RO</button>
        <button onclick="switchLang('ru')"{% if request.LANGUAGE_CODE == 'ru' %} class="active"{% endif %}>RU</button>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    function switchLang(lang) {
      // Strip any existing language prefix (/ro/... or /ru/...)
      var path = window.location.pathname.replace(/^\/(ro|ru)(\/|$)/, '/');
      // Add prefix for non-default languages
      if (lang !== 'en') path = '/' + lang + (path.startsWith('/') ? path : '/' + path);
      window.location.href = path;
    }
  </script>

</body>
</html>
